[package]
name = "claudacoda-desktop"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Explicit, bounded coordination between Codex and Claude Code"
authors = ["DeloresAI"]
default-run = "claudacoda"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "claudacoda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
coord-core = { path = "../crates/coord-core" }
tauri = { version = "=2.12.3", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
fs2 = "=0.4.3"
tempfile = "=3.27.0"
tokio = { version = "=1.53.2", features = ["process", "time", "io-util", "sync", "fs", "macros", "rt-multi-thread"] }
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
chrono = { version = "=0.4.45", features = ["serde"] }
semver = "=1.0.28"
url = "=2.5.8"
zeroize = "=1.9.1"
getrandom = "=0.3.4"
quick-xml = "=0.42.0"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
toml = "=0.8.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
