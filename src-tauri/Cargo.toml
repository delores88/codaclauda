[package]
name = "claudacoda-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Explicit, bounded coordination between Codex and Claude Code"
authors = ["DeloresAI"]
default-run = "claudacoda"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "claudacoda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["process", "time", "io-util", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
