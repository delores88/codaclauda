[package]
name = "codaclauda-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Explicit, bounded coordination between Codex and Claude Code"
authors = ["DeloresAI"]
default-run = "codaclauda"

[features]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "codaclauda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
tokio = { version = "=1.53.2", features = ["process", "time", "io-util"] }

[workspace]

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
