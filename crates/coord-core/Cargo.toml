[package]
name = "coord-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Durable owner-scoped Claude Code and Codex coordination"

[dependencies]
anyhow = "=1.0.104"
fs2 = "=0.4.3"
regex = "=1.13.1"
serde = {version = "=1.0.229", features = ["derive"]}
serde_json = "=1.0.152"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
uuid = {version = "=1.26.1", features = ["v4"]}

[target.'cfg(windows)'.dependencies]
windows-sys = {version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security", "Win32_UI_Shell", "Win32_System_Com"]}
